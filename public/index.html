<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Commit Warrior</title>
  <meta name="description" content="Look up a GitHub username. See live activity charts, career stats, and copy README cards." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand-mark" href="/" aria-label="Commit Warrior home">
      <span class="brand-glyph" aria-hidden="true"></span>
      Commit Warrior
    </a>
    <nav class="topnav">
      <a href="https://github.com/developer-az/commit-warrior" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="lookup">
      <p class="brand-hero">Commit Warrior</p>
      <h1>GitHub stats for your README</h1>
      <p class="lede">Enter a username. See today vs yesterday, charts that summarize the year, then copy the cards.</p>
      <form class="hero-form" id="lookup-form" autocomplete="off">
        <label class="sr-only" for="username">GitHub username</label>
        <div class="input-shell">
          <span class="input-prefix" aria-hidden="true">@</span>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="username"
            spellcheck="false"
            maxlength="39"
            required
          />
        </div>
        <button type="submit" id="generate-btn">
          <span>Look up</span>
        </button>
      </form>
      <p class="hero-hint" id="status-line">Public profiles only.</p>
    </section>

    <section class="report" id="generator" hidden>
      <div class="profile-strip">
        <img id="avatar" alt="" width="48" height="48" />
        <div>
          <p class="profile-name" id="profile-name"></p>
          <a class="profile-link" id="profile-link" target="_blank" rel="noopener"></a>
        </div>
        <div class="meta-right">
          <span class="rank-pill" id="rank-pill"></span>
          <span class="live-line">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="live-label">Live</span>
            <time id="served-at" datetime=""></time>
          </span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Today</h2>
          <span class="status-chip" id="status-chip"></span>
        </div>
        <div class="delta-board" id="delta-board" aria-live="polite"></div>
        <div id="sparkline" class="sparkline-host"></div>
      </div>

      <div class="highlights" id="highlights"></div>

      <div class="panel viz-panel">
        <div class="panel-head">
          <h2>Year at a glance</h2>
          <span class="panel-note" id="consistency-note"></span>
        </div>
        <div class="viz-grid">
          <figure class="viz-block">
            <figcaption>Languages</figcaption>
            <div id="lang-donut" class="viz-host"></div>
          </figure>
          <figure class="viz-block">
            <figcaption>Weekday rhythm</figcaption>
            <div id="weekday-chart" class="viz-host"></div>
          </figure>
          <figure class="viz-block">
            <figcaption>PR funnel</figcaption>
            <div id="funnel-chart" class="viz-host"></div>
          </figure>
          <figure class="viz-block span-wide">
            <figcaption>Last 12 weeks</figcaption>
            <div id="weekly-chart" class="viz-host"></div>
          </figure>
          <figure class="viz-block span-wide">
            <figcaption>Monthly trend</figcaption>
            <div id="monthly-chart" class="viz-host"></div>
          </figure>
        </div>
        <div class="milestones" id="milestones"></div>
      </div>

      <div class="metrics" id="metrics"></div>

      <div class="panel">
        <div class="panel-head">
          <h2>README cards</h2>
          <div class="controls">
            <label>
              Theme
              <select id="theme">
                <option value="professional" selected>Professional</option>
                <option value="default">GitHub</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="tokyonight">Tokyo Night</option>
                <option value="radical">Radical</option>
                <option value="transparent">Transparent</option>
              </select>
            </label>
            <label class="check">
              <input type="checkbox" id="show-icons" checked />
              Icons
            </label>
            <label class="check">
              <input type="checkbox" id="hide-rank" />
              Hide rank
            </label>
            <label class="check">
              <input type="checkbox" id="compact-langs" checked />
              Compact
            </label>
          </div>
        </div>
        <div class="card-picks" id="card-picks">
          <label class="check"><input type="checkbox" data-card="stats" checked /> Stats</label>
          <label class="check"><input type="checkbox" data-card="langs" checked /> Languages</label>
          <label class="check"><input type="checkbox" data-card="streak" checked /> Streak</label>
          <label class="check"><input type="checkbox" data-card="graph" checked /> Graph</label>
          <label class="check"><input type="checkbox" data-card="activity" checked /> Activity</label>
          <label class="check"><input type="checkbox" data-card="milestones" checked /> Milestones</label>
        </div>
        <div class="card-stage">
          <figure class="card-frame" data-preview="stats">
            <figcaption>Stats</figcaption>
            <img id="stats-card" alt="Stats card" />
          </figure>
          <figure class="card-frame" data-preview="langs">
            <figcaption>Languages</figcaption>
            <img id="langs-card" alt="Languages card" />
          </figure>
          <figure class="card-frame" data-preview="streak">
            <figcaption>Streak</figcaption>
            <img id="streak-card" alt="Streak card" />
          </figure>
          <figure class="card-frame" data-preview="milestones">
            <figcaption>Milestones</figcaption>
            <img id="milestones-card" alt="Milestones card" />
          </figure>
          <figure class="card-frame span-full" data-preview="graph">
            <figcaption>Graph</figcaption>
            <img id="graph-card" alt="Contribution graph" />
          </figure>
          <figure class="card-frame span-full" data-preview="activity">
            <figcaption>Activity</figcaption>
            <img id="activity-card" alt="Activity graph" />
          </figure>
        </div>
      </div>
    </section>

    <section class="embed" id="embed" hidden>
      <div class="panel-head">
        <h2>Markdown</h2>
        <button type="button" class="copy-btn" id="copy-btn">Copy</button>
      </div>
      <pre class="code-block"><code id="markdown-output"></code></pre>
    </section>
  </main>

  <footer class="footer">
    <p><a href="https://github.com/developer-az/commit-warrior" target="_blank" rel="noopener">Source</a></p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
