<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Commit Warrior Widget</title>
  <style>
    :root {
      color-scheme: dark;
      --ground: #0b0d10;
      --surface: #15191e;
      --raised: #20262d;
      --ink: #f5f7fa;
      --muted: #a9b1bb;
      --faint: #8b949e;
      --data: #3fb950;
      --heat-0: #20262d;
      --heat-1: #143a24;
      --heat-2: #1c6b34;
      --heat-3: #2a9c45;
      --heat-4: #3fd45c;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--ground);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
    }
    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      cursor: grab;
    }
    .mark {
      width: 26px; height: 26px;
      display: grid; place-items: center;
      border-radius: 7px;
      background: var(--surface);
      color: var(--data);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .brand { font-size: 14px; font-weight: 600; }
    .close {
      margin-left: auto;
      width: 28px; height: 28px;
      border: 0;
      border-radius: 7px;
      background: var(--surface);
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .close:hover { color: var(--ink); background: var(--raised); }
    .form { display: flex; gap: 8px; }
    .form input {
      flex: 1; min-width: 0;
      height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }
    .form button {
      height: 34px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: var(--ground);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .lead {
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .grade { font-size: 40px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; }
    .score { color: var(--muted); font-size: 14px; }
    .score b { color: var(--data); font-weight: 600; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric {
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--surface);
    }
    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 3px; font-size: 20px; font-weight: 500; }
    .pulse { padding: 12px 14px; border-radius: var(--radius); background: var(--surface); }
    .pulse-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .pulse-grid {
      margin-top: 8px;
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(7, 7px);
      grid-auto-columns: 7px;
      gap: 2px;
    }
    .pulse-grid i { border-radius: 1px; background: var(--heat-0); }
    .pulse-grid i.l1 { background: var(--heat-1); }
    .pulse-grid i.l2 { background: var(--heat-2); }
    .pulse-grid i.l3 { background: var(--heat-3); }
    .pulse-grid i.l4 { background: var(--heat-4); }
    .status { margin: 0; color: var(--faint); font-size: 12px; }
    .status.error { color: #e5484d; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="head" data-tauri-drag-region>
      <span class="mark">CW</span>
      <span class="brand">Commit Warrior</span>
      <button type="button" class="close" id="close-widget" aria-label="Hide widget">×</button>
    </header>

    <form class="form" id="widget-form">
      <input id="widget-user" type="text" placeholder="GitHub username" maxlength="39" spellcheck="false" aria-label="GitHub username" />
      <button type="submit">Load</button>
    </form>

    <div class="lead" aria-live="polite">
      <strong class="grade" id="widget-level">—</strong>
      <span class="score"><b id="widget-score">—</b> / 100 · weighted activity score</span>
    </div>

    <div class="metrics">
      <div class="metric"><span>Current streak</span><strong id="widget-streak">—</strong></div>
      <div class="metric"><span>Today</span><strong id="widget-today">—</strong></div>
      <div class="metric"><span>All-time commits</span><strong id="widget-commits">—</strong></div>
    </div>

    <section class="pulse" aria-label="Contribution activity over the last 26 weeks">
      <div class="pulse-head"><span>Last 26 weeks</span><span id="widget-total">—</span></div>
      <div class="pulse-grid" id="widget-pulse"></div>
    </section>

    <p class="status" id="widget-status">Enter a GitHub username.</p>
  </main>

  <script src="/bridge.js"></script>
  <script src="/widget.js"></script>
</body>
</html>
